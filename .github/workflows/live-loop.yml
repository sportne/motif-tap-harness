name: live-loop

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'c/**'
      - 'containers/live-loop/**'
      - 'examples/motif_calc/**'
      - 'examples/motif_work_order/**'
      - 'pyproject.toml'
      - 'scripts/live-loop-*.sh'
      - 'src/motiftap/**'
      - 'tests/**'
  push:
    paths:
      - '.github/workflows/**'
      - 'c/**'
      - 'containers/live-loop/**'
      - 'examples/motif_calc/**'
      - 'examples/motif_work_order/**'
      - 'pyproject.toml'
      - 'scripts/live-loop-*.sh'
      - 'src/motiftap/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: live-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build live-loop image
        run: docker build -f containers/live-loop/Dockerfile -t motif-tap-live-loop .
      - name: Run live-loop demos
        run: |
          mkdir -p live-loop-artifacts/calculator live-loop-artifacts/work-order
          docker run --rm \
            -e MOTIF_TAP_LIVE_ARTIFACT_DIR=/artifacts/calculator \
            -v "$PWD/live-loop-artifacts:/artifacts" \
            motif-tap-live-loop bash scripts/live-loop-demo.sh
          docker run --rm \
            -e MOTIF_TAP_LIVE_ARTIFACT_DIR=/artifacts/work-order \
            -v "$PWD/live-loop-artifacts:/artifacts" \
            motif-tap-live-loop bash scripts/live-loop-work-order-demo.sh
      - name: Upload live-loop artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-loop-artifacts
          path: live-loop-artifacts
          if-no-files-found: warn
