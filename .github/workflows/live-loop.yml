name: live-loop

on:
  workflow_dispatch:

jobs:
  live-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build live-loop image
        run: docker build -f containers/live-loop/Dockerfile -t motif-tap-live-loop .
      - name: Run live-loop demo
        run: |
          mkdir -p live-loop-artifacts
          docker run --rm \
            -e MOTIF_TAP_LIVE_ARTIFACT_DIR=/artifacts \
            -v "$PWD/live-loop-artifacts:/artifacts" \
            motif-tap-live-loop scripts/live-loop-demo.sh
      - name: Upload live-loop artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-loop-artifacts
          path: live-loop-artifacts
